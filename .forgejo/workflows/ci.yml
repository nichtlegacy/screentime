# Forgejo runs this file and ignores .github/workflows/ (GitHub: Linux + macOS).
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: python-3.12
    env:
      PIP_ROOT_USER_ACTION: ignore
      UV_LINK_MODE: copy
    steps:
      - name: Install Node.js for the checkout action
        run: |
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
            | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
          echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" \
            > /etc/apt/sources.list.d/nodesource.list
          apt-get update
          apt-get install -y nodejs

      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install uv
        run: python -m pip install uv

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

      - name: Build and install the wheel
        run: |
          uv build
          uv venv /tmp/wheel-test
          uv pip install --python /tmp/wheel-test dist/*.whl
          /tmp/wheel-test/bin/screentime --help
