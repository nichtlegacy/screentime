<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Screen Time Exporter">
  <!-- A 24-hour dial with midnight at the top. The lit quarter is 00:00-06:00,
       the late night the exporter counts; the three bars are hours of use. -->
  <defs>
    <linearGradient id="tile" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2f8f"/>
      <stop offset="0.55" stop-color="#1b1748"/>
      <stop offset="1" stop-color="#0c0b1f"/>
    </linearGradient>
    <linearGradient id="arc" x1="32" y1="12" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4dcff"/>
      <stop offset="1" stop-color="#a593ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="5"/>
  <path d="M32 14a18 18 0 0 1 18 18" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round"/>
  <g fill="#fff">
    <rect x="22.75" y="31" width="4.5" height="10" rx="2.25"/>
    <rect x="29.75" y="23" width="4.5" height="18" rx="2.25"/>
    <rect x="36.75" y="28" width="4.5" height="13" rx="2.25"/>
  </g>
</svg>
